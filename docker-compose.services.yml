version: "3.8"

x-common-build: &common-build
  context: ./backend
  dockerfile: Dockerfile

services:
  auth-service:
    build:
      <<: *common-build
      args:
        SERVICE_MODULE: auth_service.app
    container_name: polystrategy-auth
    network_mode: host
    env_file: .env
    environment:
      SERVICE_NAME: polystrategy-auth
      SERVICE_PORT: "8010"
    volumes:
      - ./logs:/logs
    restart: unless-stopped

  account-service:
    build:
      <<: *common-build
      args:
        SERVICE_MODULE: account_service.app
    container_name: polystrategy-account
    network_mode: host
    env_file: .env
    environment:
      SERVICE_NAME: polystrategy-account
      SERVICE_PORT: "8011"
    volumes:
      - ./logs:/logs
    restart: unless-stopped
    depends_on:
      - auth-service

  signal-weather-orderbook:
    build:
      <<: *common-build
      args:
        SERVICE_MODULE: signal_weather_orderbook.app
    container_name: polystrategy-signal-weather-orderbook
    network_mode: host
    env_file: .env
    environment:
      SERVICE_NAME: polystrategy-signal-weather-orderbook
      SERVICE_PORT: "8001"
    volumes:
      - ./logs:/logs
    restart: unless-stopped
    depends_on:
      - auth-service

  strategy-weather-sweep:
    build:
      <<: *common-build
      args:
        SERVICE_MODULE: strategy_weather_sweep.app
    container_name: polystrategy-strategy-weather-sweep
    network_mode: host
    env_file: .env
    environment:
      SERVICE_NAME: polystrategy-strategy-weather-sweep
      SERVICE_PORT: "8003"
      WEATHER_SIGNAL_WS_URL: ws://127.0.0.1:8001/ws/signals
    volumes:
      - ./logs:/logs
    restart: unless-stopped
    depends_on:
      - signal-weather-orderbook

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polystrategy-frontend
    network_mode: host
    environment:
      API_GATEWAY: 127.0.0.1:${TRAEFIK_ENTRY_PORT:-8000}
      NGINX_PORT: ${FRONTEND_PORT:-9097}
    restart: unless-stopped
    depends_on:
      - auth-service
