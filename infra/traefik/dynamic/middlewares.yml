http:
  middlewares:
    forward-auth:
      forwardAuth:
        address: "http://127.0.0.1:8010/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"
          - "X-Username"

    dashboard-auth:
      basicAuth:
        # 生成: htpasswd -nb admin your_password
        users:
          - "admin:$apr1$PLACEHOLDER$REPLACE_WITH_HTPASSWD_OUTPUT"

    auth-public:
      stripPrefix:
        prefixes: []

  routers:
    dashboard:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints:
        - web
      service: api@internal
      middlewares:
        - dashboard-auth
