service:
  name: polystrategy-signal-weather-orderbook
  port: 8001

consul:
  tags:
    - "traefik.enable=true"
    - "traefik.http.routers.polystrategy-signal-weather-orderbook.rule=PathPrefix(`/api/weather`)"
    - "traefik.http.routers.polystrategy-signal-weather-orderbook.entrypoints=web"
    - "traefik.http.routers.polystrategy-signal-weather-orderbook.middlewares=forward-auth@file"
  health_path: /health

dependencies: []
